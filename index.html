<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1b1b1f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Google Переводчик</title>
  
  <!-- Подключение иконок Google Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  
  <style>
    :root {
      --bg-main: #131314;
      --bg-surface: #1e1e20;
      --bg-surface-variant: #282a2d;
      --text-primary: #e3e2e6;
      --text-secondary: #c4c6d0;
      --accent: #a8c7fa;
      --accent-secondary: #c2e7ff;
      --divider: #44474f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-primary); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Общие классы иконок */
    .icon { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; font-feature-settings: 'liga'; }

    /* --- ЭКРАН 1: ВВОД ТЕКСТА --- */
    #inputScreen { display: flex; flex-direction: column; height: 100%; }

    /* Верхняя панель (Header) */
    .header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .header-icons { display: flex; align-items: center; gap: 16px; }
    .star-btn { color: var(--text-primary); font-size: 26px; }
    .logo-container { display: flex; align-items: center; font-size: 18px; font-weight: 500; gap: 4px; }
    .logo-google { font-weight: 700; }
    .logo-translate { color: var(--text-secondary); font-weight: 400; }
    .avatar-btn { width: 34px; height: 34px; background-color: #000; border-radius: 50%; cursor: pointer; border: 1px solid var(--divider); }

    /* Пилл "Расширенная" */
    .advanced-pill { margin: 0 auto; background-color: var(--bg-surface-variant); padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; width: max-content; margin-bottom: 24px; }

    /* Область ввода */
    .input-area { flex: 1; padding: 0 24px; display: flex; flex-direction: column; position: relative; }
    #inputText { width: 100%; flex: 1; background: transparent; border: none; color: var(--text-primary); font-size: 32px; font-weight: 400; resize: none; outline: none; }
    #inputText::placeholder { color: var(--text-secondary); }
    .paste-btn { position: absolute; left: 24px; top: 60px; background-color: var(--bg-surface-variant); color: var(--accent); border: none; padding: 10px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .pen-icon { position: absolute; right: 24px; top: 0; color: var(--text-primary); font-size: 28px; }

    /* Кнопка "Перевести" (Появляется при вводе) */
    #translateBtn { display: none; background-color: var(--accent); color: #003062; border: none; padding: 16px; border-radius: 30px; font-size: 16px; font-weight: 600; margin: 16px 24px; }

    /* Нижняя панель */
    .bottom-panel { background-color: var(--bg-surface); border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 16px; padding-bottom: 32px; }
    .drag-handle { width: 40px; height: 4px; background-color: var(--divider); border-radius: 2px; margin: 0 auto 20px; }
    
    .lang-selector { display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-main); border-radius: 16px; padding: 8px; margin-bottom: 24px; }
    .lang-btn { flex: 1; text-align: center; padding: 12px; font-size: 16px; font-weight: 500; color: var(--text-primary); background: transparent; border: none; }
    .swap-btn { color: var(--text-primary); padding: 8px; }

    .action-buttons { display: flex; justify-content: space-around; align-items: flex-end; }
    .action-btn-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .action-circle { width: 64px; height: 64px; border-radius: 50%; background-color: var(--bg-surface-variant); display: flex; justify-content: center; align-items: center; color: var(--accent); font-size: 28px; }
    .action-circle.mic { width: 88px; height: 88px; background-color: #b4c5ff; color: #002b73; font-size: 36px; }
    .action-label { font-size: 12px; color: var(--text-secondary); }

    /* --- ЭКРАН 2: РЕЗУЛЬТАТ ПЕРЕВОДА --- */
    #resultScreen { display: none; flex-direction: column; height: 100%; background-color: var(--bg-main); }
    
    .result-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
    .back-btn, .header-actions { color: var(--text-primary); font-size: 28px; }
    
    .result-content { padding: 0 24px; flex: 1; overflow-y: auto; }
    
    .source-lang { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; margin-top: 16px; }
    .source-text { font-size: 28px; color: var(--text-primary); margin-bottom: 8px; word-break: break-word; }
    .transcription { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
    
    .controls-row { display: flex; justify-content: space-between; color: var(--text-secondary); font-size: 24px; margin-bottom: 32px; border-bottom: 1px solid var(--divider); padding-bottom: 24px; }
    .controls-left { display: flex; gap: 24px; }

    .target-lang { font-size: 14px; color: var(--accent); margin-bottom: 8px; }
    .target-text { font-size: 32px; color: var(--accent-secondary); margin-bottom: 8px; word-break: break-word; }
    .target-type { font-size: 14px; color: var(--text-primary); margin-bottom: 24px; font-weight: 500; display: flex; gap: 8px; }
    .target-type span { font-style: italic; color: var(--text-secondary); font-weight: 400; }
    
    .controls-right { display: flex; gap: 24px; justify-content: flex-end; color: var(--accent); font-size: 24px; }

    /* Неприметная буква ответа */
    #subtleAnswer { font-size: 13px; color: var(--bg-surface-variant); text-align: right; margin-top: 32px; font-weight: 700; }

    /* --- ПОПАП ДЛЯ API КЛЮЧА --- */
    #apiPopup { display: none; position: absolute; bottom: 0; left: 0; right: 0; background-color: var(--bg-surface); padding: 24px; border-top-left-radius: 24px; border-top-right-radius: 24px; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); }
    .api-popup-title { font-size: 18px; margin-bottom: 16px; font-weight: 500; }
    .api-input { width: 100%; background: var(--bg-main); border: 1px solid var(--divider); padding: 12px; border-radius: 8px; color: white; margin-bottom: 16px; }
    .api-save-btn { background: var(--accent); color: #000; padding: 10px 24px; border: none; border-radius: 20px; font-weight: 600; width: 100%; }

    .overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 90; }
  </style>
</head>
<body>

  <!-- ЭКРАН 1: ВВОД -->
  <div id="inputScreen">
    <div class="header">
      <div class="header-icons">
        <span class="icon star-btn">star</span>
      </div>
      <div class="logo-container">
        <span class="logo-google">Google</span>
        <span class="logo-translate">Переводчик</span>
      </div>
      <div class="avatar-btn" id="avatarBtn"></div>
    </div>

    <div class="advanced-pill">Расширенная</div>

    <div class="input-area">
      <textarea id="inputText" placeholder="Переводите текст"></textarea>
      <button class="paste-btn" id="pasteBtn"><span class="icon">content_paste</span> Вставить</button>
      <span class="icon pen-icon" id="penIcon">edit</span>
    </div>

    <button id="translateBtn">Перевести</button>

    <div class="bottom-panel" id="bottomPanel">
      <div class="drag-handle"></div>
      
      <div class="lang-selector">
        <button class="lang-btn">английский</button>
        <span class="icon swap-btn">swap_horiz</span>
        <button class="lang-btn">русский</button>
      </div>

      <div class="action-buttons">
        <div class="action-btn-col">
          <div class="action-circle"><span class="icon">group</span></div>
          <span class="action-label">Мгновенный перевод</span>
        </div>
        <div class="action-btn-col">
          <div class="action-circle mic"><span class="icon">mic</span></div>
        </div>
        <div class="action-btn-col">
          <div class="action-circle"><span class="icon">photo_camera</span></div>
          <span class="action-label">Камера</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 2: РЕЗУЛЬТАТ ПЕРЕВОДА -->
  <div id="resultScreen">
    <div class="result-header">
      <span class="icon back-btn" id="backBtn">arrow_back</span>
      <div class="header-actions">
        <span class="icon" style="margin-right: 16px;">close</span>
        <span class="icon">star_border</span>
        <span class="icon" style="margin-left: 16px;">more_vert</span>
      </div>
    </div>

    <div class="result-content">
      <div class="source-lang">английский</div>
      <div class="source-text" id="sourceTextDisplay"></div>
      <div class="transcription" id="transcriptionDisplay">'text</div>
      
      <div class="controls-row">
        <div class="controls-left">
          <span class="icon">volume_up</span>
        </div>
        <div class="controls-right" style="color: var(--text-secondary);">
          <span class="icon">content_copy</span>
        </div>
      </div>

      <div class="target-lang">русский</div>
      <div class="target-text" id="outputText">Здесь появится перевод...</div>
      <div class="target-type">Существительное <span>text</span></div>

      <div class="controls-row" style="border: none;">
        <div class="controls-left" style="color: var(--accent);">
          <span class="icon">volume_up</span>
        </div>
        <div class="controls-right">
          <span class="icon">content_copy</span>
          <span class="icon">thumb_up</span>
          <span class="icon">thumb_down</span>
        </div>
      </div>

      <!-- Неприметный ответ -->
      <div id="subtleAnswer"></div>
    </div>
  </div>

  <!-- ПОПАП АПИ КЛЮЧА -->
  <div class="overlay" id="overlay"></div>
  <div id="apiPopup">
    <div class="api-popup-title">Настройки ИИ</div>
    <input type="password" id="apiKey" class="api-input" placeholder="Введите Gemini API Key...">
    <button class="api-save-btn" id="saveApiBtn">Сохранить и закрыть</button>
  </div>

  <script>
    // --- UI Логика ---
    const inputScreen = document.getElementById('inputScreen');
    const resultScreen = document.getElementById('resultScreen');
    const inputText = document.getElementById('inputText');
    const translateBtn = document.getElementById('translateBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const penIcon = document.getElementById('penIcon');
    const bottomPanel = document.getElementById('bottomPanel');
    const backBtn = document.getElementById('backBtn');
    const outputText = document.getElementById('outputText');
    const sourceTextDisplay = document.getElementById('sourceTextDisplay');
    const subtleAnswer = document.getElementById('subtleAnswer');
    const avatarBtn = document.getElementById('avatarBtn');
    const apiPopup = document.getElementById('apiPopup');
    const overlay = document.getElementById('overlay');
    const apiKeyInput = document.getElementById('apiKey');
    const saveApiBtn = document.getElementById('saveApiBtn');

    // Логика отображения кнопки "Перевести"
    inputText.addEventListener('input', () => {
      if (inputText.value.trim().length > 0) {
        pasteBtn.style.display = 'none';
        penIcon.style.display = 'none';
        bottomPanel.style.display = 'none';
        translateBtn.style.display = 'block';
      } else {
        pasteBtn.style.display = 'flex';
        penIcon.style.display = 'block';
        bottomPanel.style.display = 'block';
        translateBtn.style.display = 'none';
      }
    });

    backBtn.addEventListener('click', () => {
      resultScreen.style.display = 'none';
      inputScreen.style.display = 'flex';
    });

    // Модальное окно API
    avatarBtn.addEventListener('click', () => {
      apiPopup.style.display = 'block';
      overlay.style.display = 'block';
    });
    saveApiBtn.addEventListener('click', () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
      apiPopup.style.display = 'none';
      overlay.style.display = 'none';
    });
    if (localStorage.getItem('gemini_api_key')) {
      apiKeyInput.value = localStorage.getItem('gemini_api_key');
    }

    // --- Логика ИИ (Gemini) ---
    const API_BASE = 'https://generativelanguage.googleapis.com/v1beta';
    const TIMEOUT_MS = 15000;

    const MODELS = [
      { id: 'gemini-3.5-flash-lite' },
      { id: 'gemini-3.8-flash', thinking: 'low' },
      { id: 'gemini-3.1-flash-lite' }
    ];

    const SYSTEM_PROMPT =
      'You are an expert translator. ' +
      '1. Translate the user text to Russian, keeping the original formatting. ' +
      '2. If the text contains a multiple-choice question, find the correct option letter. ' +
      '3. Respond STRICTLY in JSON format: {"translation": "Текст на русском", "correct_option": "A" (или null если это не тест)}.';

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    async function fetchJson(url, options = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        const data = await res.json().catch(() => ({}));
        return { res, data };
      } finally {
        clearTimeout(timer);
      }
    }

    function buildBody(text, model) {
      const body = {
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [{ role: 'user', parts: [{ text }] }],
        generationConfig: { responseMimeType: "application/json", temperature: 0.1 }
      };
      if (model.thinking) body.generationConfig.thinkingConfig = { thinkingLevel: model.thinking };
      return body;
    }

    function extractData(data) {
      const candidate = data?.candidates?.[0];
      const text = (candidate?.content?.parts || []).filter(p => !p.thought).map(p => p.text).join('').trim();
      if (!text) throw new Error('Модель не вернула ответ');
      try { return JSON.parse(text); } catch { return { translation: text, correct_option: null }; }
    }

    async function callModel(model, text, apiKey) {
      const { res, data } = await fetchJson(`${API_BASE}/models/${model.id}:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildBody(text, model))
      });
      if (res.ok) return extractData(data);
      
      const err = new Error(`HTTP ${res.status}`);
      err.retryable = res.status >= 500 || res.status === 429;
      err.fatal = res.status === 400 || res.status === 401 || res.status === 403;
      throw err;
    }

    async function processText(text, apiKey) {
      for (const model of MODELS) {
        for (let attempt = 1; attempt <= 2; attempt++) {
          try {
            return await callModel(model, text, apiKey);
          } catch (e) {
            if (e.fatal) throw e;
            if (!e.retryable || attempt === 2) break;
            translateBtn.innerText = 'Ожидание сервера...';
            await sleep(1000);
          }
        }
      }
      throw new Error('Все серверы заняты. Попробуйте позже.');
    }

    translateBtn.addEventListener('click', async () => {
      const text = inputText.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!text) return;
      if (!apiKey) {
        avatarBtn.click(); // Открываем попап
        return;
      }

      translateBtn.innerText = 'Перевод...';
      translateBtn.disabled = true;

      try {
        const result = await processText(text, apiKey);
        
        // Обновляем UI
        sourceTextDisplay.innerText = text;
        outputText.innerText = result.translation || 'Перевод пуст';
        
        if (result.correct_option && result.correct_option !== 'null') {
          subtleAnswer.innerText = String(result.correct_option).toUpperCase();
        } else {
          subtleAnswer.innerText = '';
        }

        // Переключаем экраны
        inputScreen.style.display = 'none';
        resultScreen.style.display = 'flex';

      } catch (err) {
        alert(err.name === 'AbortError' ? 'Таймаут. Проверьте интернет.' : err.message);
      } finally {
        translateBtn.innerText = 'Перевести';
        translateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
